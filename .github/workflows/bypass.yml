name: bypass-test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  bypass:
    runs-on: ubuntu-latest
    steps:
    # Checkout the branch
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main
        submodules: true
        token: ${{secrets.TAG_TOKEN}}

    # Configure Git
    - name: Set up Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    # Update the file with new content
    - name: Update bypass.txt
      run: |
        echo "This is the fresh content for bypass.txt" > bypass.txt

    # Commit the changes
    - name: Commit changes
      run: |
        git add bypass.txt
        git commit -m "Update bypass.txt with new content"

    # Push changes to the main branch
    - name: Push changes
      env:
        GITHUB_TOKEN: ${{secrets.TAG_TOKEN}}
      run: |
        git push origin main

        
