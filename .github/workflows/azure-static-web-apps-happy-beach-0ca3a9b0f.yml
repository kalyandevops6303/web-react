  #         azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_BEACH_0CA3A9B0F }}
  #         action: "close"
  Notify_Teams:
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    if: always()
    env:
      WEBHOOK: ${{ secrets.TEAMS_WORKFLOW_WEBHOOK }}
      FINAL_STATUS: ${{ needs.build_and_deploy_job.result }}
    steps:
      - name: Set color variable
        run: |
          echo "Detected FINAL_STATUS='$FINAL_STATUS'"
          FINAL_STATUS_UPPER=$(echo "$FINAL_STATUS" | tr '[:lower:]' '[:upper:]')
          echo "FINAL_STATUS_UPPER=$FINAL_STATUS_UPPER" >> $GITHUB_ENV

          
          if [ "$FINAL_STATUS" = "success" ]; then 
            echo "COLOR=good" >> $GITHUB_ENV
            echo "EMOJI=✅" >> $GITHUB_ENV
          elif [ "$FINAL_STATUS" = "failure" ]; then 
            echo "COLOR=attention" >> $GITHUB_ENV
            echo "EMOJI=❌" >> $GITHUB_ENV
          else 
            echo "COLOR=warning" >> $GITHUB_ENV
            echo "EMOJI=⚠️" >> $GITHUB_ENV
          fi
          echo "STATUS='$STATUS'"
          echo "Mapped FINAL_STATUS_UPPER=$FINAL_STATUS_UPPER COLOR=$COLOR EMOJI=$EMOJI"
          echo "needs.build_and_deploy_job.result='${{ needs.build_and_deploy_job.result }}'"
      - name: Notify Teams Chat
        run: |
          cat > /tmp/card.json <<CARD
          {
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.3",
                  "body": [
                    { "type": "TextBlock", "size": "Medium", "weight": "Bolder", "text": "GitHub Actions — $GITHUB_REPOSITORY" },
                    { "type": "TextBlock", "text": "Workflow: $GITHUB_WORKFLOW" },
                    { "type": "TextBlock", "text": "Status= $FINAL_STATUS_UPPER $EMOJI", "color": "$COLOR", "weight": "Bolder" },
                    { "type": "TextBlock", "text": "Triggered by: $GITHUB_ACTOR" },
                    { "type": "TextBlock", "text": "Commit: $GITHUB_SHA" }
                  ]
                }
              }
            ]
          }
          CARD

          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/card.json
            
          echo "STATUS=$STATUS COLOR=$COLOR"
          cat /tmp/card.json




