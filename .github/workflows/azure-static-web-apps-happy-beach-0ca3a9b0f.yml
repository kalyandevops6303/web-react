jobs:
  build_and_deploy_job:
    #if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Notify Teams (Adaptive Card POST)
        if: always()
        env:
          WEBHOOK: ${{ secrets.TEAMS_WORKFLOW_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          # compute readable status + simple color
          if [ "$STATUS" = "success" ]; then
            STATUS_LABEL="Success"
            STATUS_COLOR="Good"
          elif [ "$STATUS" = "failure" ]; then
            STATUS_LABEL="Failed"
            STATUS_COLOR="Attention"
          else
            STATUS_LABEL="Cancelled"
            STATUS_COLOR="Warning"
          fi
      
          cat > /tmp/card.json <<'CARD'
            {
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.3",
                    "body": [
                      { "type": "TextBlock", "size": "Medium", "weight": "Bolder", "text": "GitHub Actions Notification" }
                    ]
                  }
                }
              ]
            }
            CARD
            
                # now inject dynamic values safely
                # replace placeholders with actual values
                sed -i "s/GitHub Actions Notification/GitHub Actions — $GITHUB_REPOSITORY\nWorkflow: $GITHUB_WORKFLOW\nBranch: ${GITHUB_REF##*/}\nStatus: $STATUS_LABEL\nCommit: $GITHUB_SHA\nRun: https:\/\/github.com\/$GITHUB_REPOSITORY\/actions\/runs\/$GITHUB_RUN_ID/" /tmp/card.json
            
                echo "Adaptive Card Payload:"
                cat /tmp/card.json
            
                curl -sS -X POST "$WEBHOOK" \
                  -H "Content-Type: application/json" \
                  --data-binary @/tmp/card.json

          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_BEACH_0CA3A9B0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          skip_api_build: true
          skip_app_build: true
          app_location: '.'
          output_location: ''
          is_static_export: true
          ###### End of Repository/Build Configurations ######

