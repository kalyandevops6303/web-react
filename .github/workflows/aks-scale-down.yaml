name: AKS Scaling-down

on:
  workflow_dispatch:
  push:
    # branches:
    #   - uat
    tags:
      - 'test1_v*'

env:
  RGNAME: azusctr-uat-rg
  AKSNAME: azusctr-uat-aks

jobs:
  scale-aks-nodes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo 
      uses: actions/checkout@v3
      
    - name: 'Azure login'
      uses: azure/login@v1
      with:
        creds: '${{ secrets.AZURE_CREDENTIALS_UAT }}'
        
    - name: Set AKS context
      id: set-context
      uses: azure/aks-set-context@v3
      with:
        creds: '${{ secrets.AZURE_CREDENTIALS_UAT }}'
        cluster-name: ${{ env.AKSNAME }}
        resource-group: ${{ env.RGNAME }}

    - name: Scale AKS nodes up
      run: az aks nodepool scale --resource-group ${{ env.RGNAME }} --cluster-name ${{ env.AKSNAME }} --nodepool-name trghauatnp --node-count 0 

    # Azure logout

    - name: Logout from Azure
      run: az logout

