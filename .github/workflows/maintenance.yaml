name: frontend-ci-cd-maintenance site configuration
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select environment for maintenance site configuration"
        required: true
        type: choice
        options:
          - uat
          - tru-uat
          - tru-uat-auto
          - tru-lti
          - tru-wipro
          - tru-prod
          - prod

jobs:
  frontend-ci-cd-maintenace:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
      
        with:
          fetch-depth: 0
          #ref: ${{ vars.BRANCH }}
          submodules: true
      # this is the new step
      - uses: dchourasia/ms-teams-notification@1.0 #  or "./" if in a local set-up
        if: always()
        with:
          github-token: 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
          webhook-uri: https://sysforetech.webhook.office.com/webhookb2/8a18ecbb-1d97-4f81-9df5-8e51170a53a7@24917450-fe15-4414-92ed-94fa8ec1b938/IncomingWebhook/961c4fc0264c49b38b04530bac141909/d10e89d2-468d-4b4f-a87f-07fa9967914e/V2DESxahJUwHy0ihd4yfXvbEEHTNiRpe3AN4AGb2B05WA1
      - name: Set Azure Static Web Apps Token
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "tru-uat" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TRU_TEST }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.environment }}" == "tru-uat-auto" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TRU_UAT_AUTO }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.environment }}" == "tru-wipro" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TRU_WIPRO }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.environment }}" == "uat" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UAT }}" >> $GITHUB_ENV    
          elif [[ "${{ github.event.inputs.environment }}" == "tru-prod" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TRU_PROD }}" >> $GITHUB_ENV 
          elif [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.environment }}" == "tru-lti" ]]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TRU_LTI }}" >> $GITHUB_ENV
          else
            echo "Error: Unrecognized environment "
            exit 1
          fi

      - name: Static Webapp Deployment 
        id: webapp_deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          skip_api_build: true
          skip_app_build: true
          app_location: '/custom'
          output_location: ''
          is_static_export: true

      # Azure logout
      - name: logout
        run: |
          az logout
        if: always()
