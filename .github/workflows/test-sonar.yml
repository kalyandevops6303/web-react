name: Sonar Test one

on:
    workflow_dispatch:
    schedule:
        - cron: '30 8 * * *'

jobs:
  build-and-analyze:
    runs-on: [self-hosted, linux, X64, label1]
    strategy:
      fail-fast: false
      matrix:
        service: [ python-func-backend, nodejs-frontend ]

    steps:
      - name: Set service-specific variables
        id: vars
        run: |
          case "${{ matrix.service }}" in
            python-func-backend)
              echo "repo=kalyandevops6303/python-function" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.CALORIE_PK }}" >> $GITHUB_OUTPUT
              echo "service=backend" >> $GITHUB_OUTPUT
              echo "type=backend" >> $GITHUB_OUTPUT
              ;;
            nodejs-frontend)
              echo "repo=kalyandevops6303/nodejs-project-demo" >> $GITHUB_OUTPUT
              echo "key=${{ secrets.SOLAR_PK }}" >> $GITHUB_OUTPUT
              echo "service=frontend" >> $GITHUB_OUTPUT
              echo "type=frontend" >> $GITHUB_OUTPUT
              ;;
          esac
      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
        
      - name: Clean existing service directory
        run: |
         rm -rf service
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
            repository: ${{ steps.vars.outputs.repo }}
            # token: ${{ secrets.TAG_TOKEN }}
            ref: main
            submodules: true
            path: service

      # - name: Set up Python
      #   if: steps.vars.outputs.type == 'backend'
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.x'

      # - name: Set up Node.js
      #   if: steps.vars.outputs.type == 'frontend'
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      - name: Install Backend Dependencies
        if: steps.vars.outputs.type == 'backend'
        run: |
          cd service
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pytest
      - name: Install Frontend Dependencies
        if: steps.vars.outputs.type == 'frontend'
        run: |
          cd service
          npm ci
      
      - name: Run SonarQube Scanner(frontend)
        if: steps.vars.outputs.type == 'frontend'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
         SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
         SONAR_HOST_URL: http://4.242.219.84:7500 #${{ secrets.SONARQUBE_TOKEN }}
        with:
          projectBaseDir: service
          args: >
            -Dsonar.projectKey=${{ steps.vars.outputs.key }}
            -Dsonar.projectName=${{ matrix.service }}
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=.

      - name: Run SonarQube Scanner(backend)
        if: steps.vars.outputs.type == 'backend'
        env:
         SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
         SONAR_HOST_URL: http://4.242.219.84:7500 #${{ secrets.SONARQUBE_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: service
          args: >
            -Dsonar.projectKey=${{ steps.vars.outputs.key }}
            -Dsonar.projectName=${{ matrix.service }}
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=.
          
        #continue-on-error: true

      - name: Clean up
        if: always()
        run: rm -rf service
        #continue-on-error: true
