# This workflow runs formatting checks and build verification on pull requests
# Each job will appear as a separate check in the GitHub PR interface

name: Built & Pretty

on:
  pull_request:
    # Trigger this workflow for pull requests to all branches
    branches: ['*']

jobs:
  # Separate job for formatting checks
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set up Node environment
      - uses: actions/setup-node@v3
        with:
          node-version: '20.18.0'
      # Cache Yarn dependencies
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      # Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      # Run Prettier check - this will show as a separate check in GitHub
      - name: Check Prettier formatting
        run: yarn format:check

  # Separate job for build verification
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set up Node environment
      - uses: actions/setup-node@v3
        with:
          node-version: '20.18.0'
      # Cache Yarn dependencies
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      # Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      # Build the project
      - name: Build project
        run: yarn build
