        ORG_ADM_STATIC_WEBAPP_HOSTNAME=$(az staticwebapp show --name swa-org-adm-${{ github.event.inputs.env_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 --query "defaultHostname" --output tsv)
        echo "ORG_ADM_STATIC_WEBAPP_ID=$ORG_ADM_STATIC_WEBAPP_ID" >> $GITHUB_ENV
