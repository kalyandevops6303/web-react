   ################ Kubernetes configuration ###########################
  
 # Set the target AKS cluster.
    - uses: azure/aks-set-context@v4
      with:
        cluster-name: aks-api-cm-prod-eus2-01
        resource-group: rg-cm-prod-eus2-01

    #install kubectl on container (runner)
    - uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.2' # default is latest stable
      id: install

    # K8s namespace
    - name: K8s
      run: |
          kubectl get namespace ${{ github.event.inputs.env_name }} || kubectl create namespace ${{ github.event.inputs.env_name }}
          kubectl create secret tls trumio-tls-secret --cert=cert.pem --key=key.pem -n ${{ github.event.inputs.env_name }}

    # - uses: Azure/k8s-deploy@v5
    #   with:
    #     action: deploy
    #     namespace: '${{ github.event.inputs.env_name }}'
    #     manifests: |
    #       ingress/ingress-${{ github.event.inputs.env_name }}.yml

  # K8s user nodepool
    - name: K8s nodepool
      if: ${{  github.event.inputs.env_name == 'tru-prod' }}
      run: |
          az aks nodepool add --cluster-name aks-api-cm-prod-eus2-01 --name usrtruprdeus -g rg-cm-prod-eus2-01 --labels workload=tru-wipro --enable-cluster-autoscaler --max-count 3 --max-pods 30 --min-count 1 --node-count 1 --node-osdisk-size 64 --mode User --node-osdisk-type Managed --node-vm-size Standard_E2as_v5 --vnet-subnet-id /subscriptions/b983da0b-033c-4c43-b7b2-eb5e4a976343/resourceGroups/rg-cm-prod-eus2-01/providers/Microsoft.Network/virtualNetworks/vnet-cm-prod-eus2-01/subnets/snet-aks-prod-eus2-01


  Frontend-services-configuration(swa):
    runs-on: trumio-prod-orgrunner

    steps:
    - name: Project-advisor Static Webapp
      if: ${{ github.event.inputs.project_adv_service == 'yes' }}
      run: |
        # Project-advisor static webapp creation
        az staticwebapp create --name swa-proj-adv-${{ github.event.inputs.client_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 \
        --location EastUs2 --sku Standard --source https://github.com/trumio/flex-project-advisor-fe --branch tru-prod --token ${{ secrets.WEBAPP_TOKEN }} --app-location "/" --output-location "build"
        echo "Azure Project-advisor Static webapp created successfully!"
    - name: Mio-interview Static Webapp
      if: ${{ github.event.inputs.mio_int_service == 'yes' }}
      run: |
        # mio-interview static webapp creation
        az staticwebapp create --name swa-mio-int-${{ github.event.inputs.env_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 \
        --location EastUs2 --sku Standard --source https://github.com/trumio/flex-mio-interviews-fe --branch tru-prod --token ${{ secrets.WEBAPP_TOKEN }} --app-location "/" --output-location "build"
        echo "Azure mio-interview Static webapp created successfully!"
    - name: org-admin Static Webapp
      if: ${{ github.event.inputs.org_adm_service == 'yes' }}
      run: |
        # org-admin static webapp creation
        az staticwebapp create --name swa-org-adm-${{ github.event.inputs.env_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 \
        --location EastUs2 --sku Standard --source https://github.com/trumio/flex-org-admin-fe --branch tru-prod --token ${{ secrets.WEBAPP_TOKEN }} --app-location "/" --output-location "build"
        echo "Azure org-admin Static webapp created successfully!"

############ static web app details Extraction
    - name: Retrieve webapp id & host(project-advisor)
      if: ${{ github.event.inputs.project_adv_service == 'yes' }}
      run: |
        PROJECT_ADV_STATIC_WEBAPP_ID=$(az staticwebapp show --name swa-proj-adv-${{ github.event.inputs.client_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 --query "id" --output tsv)
        PROJECT_ADV_STATIC_WEBAPP_HOSTNAME=$(az staticwebapp show --name swa-proj-adv-${{ github.event.inputs.client_name }}-eus2-01 --resource-group rg-${{ github.event.inputs.env_name }}-eus2-01 --query "defaultHostname" --output tsv)
        echo "PROJECT_ADV_STATIC_WEBAPP_ID=$PROJECT_ADV_STATIC_WEBAPP_ID" >> $GITHUB_ENV
        echo "PROJECT_ADV_STATIC_WEBAPP_HOSTNAME=$PROJECT_ADV_STATIC_WEBAPP_HOSTNAME" >> $GITHUB_ENV
    - name: Retrieve webapp id & host(mio-interview)
      if: ${{ github.event.inputs.mio_int_service == 'yes' }}
